# Publie site/ (accueil, confidentialité, conditions : les trois liens que Google demande) sur GitHub Pages,
# https://kasiopajg.github.io/molinova/. Ne fonctionne qu'une fois le dépôt public (ou sur une offre payante) et Pages
# activé avec la source « GitHub Actions » (voir CONTRIBUTING.md). Actions épinglées par SHA de commit (tag en commentaire).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

# Une seule publication à la fois ; celle en cours va au bout (pas d'annulation au milieu d'un déploiement).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
